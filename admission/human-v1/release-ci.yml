name: Human admission v1
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  human-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Ensure original PDF extraction is available
        run: command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - run: pnpm install --frozen-lockfile
      - name: Human admission v1 entry (no-op without a human release; otherwise live Owner approval, offline original receipt, frozen legacy replay, current-tree checks)
        run: python3 admission/human-v1/human.py ci
        env:
          GH_TOKEN: ${{ github.token }}
