name: Rule-based identity admission (inactive)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-rule-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Immutable legacy baselines and explicit v2 executor bindings
        run: python3 admission/v1/verify.py
      - name: Synthetic offline E2E and negative authority/identity/evidence tests
        run: python3 admission/v1/test_engine.py
      - name: Reachable history rights audit (no private originals available)
        run: python3 scripts/evidence/korea_readiness.py rights
