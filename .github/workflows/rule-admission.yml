name: Rule-based identity admission
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  isolated-rule-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Immutable legacy baselines and explicit v2 executor bindings
        run: python3 scripts/evidence/legacy_replay.py rule-verify
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Rule registration negative authority tests
        run: python3 scripts/evidence/legacy_replay.py rule-registration
      - name: Synthetic offline E2E and negative authority/identity/evidence tests
        run: python3 scripts/evidence/legacy_replay.py rule-engine
      - name: Reachable history rights audit (no private originals available)
        run: python3 scripts/evidence/legacy_replay.py kr-rights
