name: CI
on:
  push:
    branches: [main, feat/bootstrap]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Ensure original PDF extraction is available
        run: command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Reproduce complete global candidate ranking
        run: python3 scripts/evidence/global_code_screen.py --check
      - name: Audit global evidence, source use and research queue
        run: python3 scripts/evidence/global_code_audit.py --check
      - name: Replay global code/date resolver differentials
        run: node scripts/evidence/global_code_coverage.ts validate
      - run: pnpm validate:data
      - run: pnpm validate:admission
      - run: pnpm test
      - run: pnpm test:research
      - run: pnpm research:validate
      - run: pnpm reference:validate
      - run: pnpm test:reference
      - run: pnpm evidence:validate
      - run: pnpm evidence:global validate
      - run: pnpm evidence:markets validate
      - run: pnpm evidence:transfers validate
      - run: pnpm evidence:priority-markets validate
      - run: pnpm evidence:first-admission validate
      - run: pnpm policy:validate
      - run: pnpm evidence:history
      - run: pnpm test:evidence
      - name: Public-data identity and deterministic shard tests
        run: pnpm test:public-data
      - name: Validate public-data manifests and pending research proposals
        run: python3 scripts/evidence/public_data.py validate
      - name: Reproduce public-data package without acquisition cache
        run: python3 scripts/evidence/public_data.py reproduce
      - run: pnpm build
  policy-admission-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Ensure original PDF extraction is available
        run: command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - run: pnpm install --frozen-lockfile
      - name: Isolated test-authority admission and full candidate CI (offline receipt replay)
        run: pnpm policy:rehearse
